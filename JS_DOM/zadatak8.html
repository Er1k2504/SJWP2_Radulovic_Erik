<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .kartica{
            width: 300px;
            height: 300px;
            background-color: lightblue;

        }
    </style>
</head>
<body>
<div class = "kartica"> </div>
<button>Klikni me</button>
    

<script>
    let kartica = document.querySelector('.kartica');
    let toggle = document.querySelector('button');

    toggle.onclick = function() {
        kartica.classList.toggle('kartica');
};

</script>
</body>
</html>
