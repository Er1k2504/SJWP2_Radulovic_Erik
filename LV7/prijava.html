<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava na izlet</title>
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>

  <header class="zaglavlje">
    <h1>Prijava na stru&ccaron;ni izlet</h1>
    <p>Tehni&ccaron;ka &scaron;kola Slavonski Brod</p>
  </header>

  <main class="omotac">

    <form class="obrazac" action="primljeno.html" method="get">

      <p class="polje">
        <label for="ime">Ime i prezime</label>
        <input type="text" id="ime" name="ime" placeholder="Ana Horvat" required maxlength = "40">
      </p>

      <p class="polje">
        <label for="eposta">E-po&scaron;ta</label>
        <input type="email" id="eposta" name="eposta" placeholder="ana@primjer.hr" required>
      </p>

      <p class="polje">
    <label for="mobitel">Broj mobitela</label>
    <input type="tel" id="mobitel" name="mobitel"
           placeholder="0911234567" required>
      </p>

      <p class="polje">
        <label for="datum">Datum ro&dstrok;enja</label>
        <input type="date" id="datum" name="datum">
      </p>

      <p class="polje">
        <label for="sudionici">Broj sudionika</label>
        <input type="number" id="sudionici" name="sudionici" min="1" max="5" step="1" value="1">
      </p>

      <p class="polje">
    <label for="polazak">Datum polaska</label>
    <input type="date" id="polazak" name="polazak"
           value="2026-11-10" min="2026-11-10" required>
      </p>

      <fieldset class="skupina">
        <legend>Veli&ccaron;ina majice</legend>
        <p class="izbor">
          <input type="radio" id="majica-s" name="majica" value="S">
          <label for="majica-s">S</label>
        </p>
        <p class="izbor">
          <input type="radio" id="majica-m" name="majica" value="M" checked>
          <label for="majica-m">M</label>
        </p>
        <p class="izbor">
          <input type="radio" id="majica-l" name="majica" value="L">
          <label for="majica-l">L</label>
        </p>
      </fieldset>


      <fieldset class="skupina">
    <legend>Način plaćanja</legend>

    <p class="izbor">
        <input type="radio" id="gotovina" name="placanje"
               value="gotovina">
        <label for="gotovina">Gotovina</label>
    </p>

    <p class="izbor">
        <input type="radio" id="kartica" name="placanje"
               value="kartica" checked>
        <label for="kartica">Kartica</label>
    </p>

    <p class="izbor">
        <input type="radio" id="uplata" name="placanje"
               value="uplata">
        <label for="uplata">Bankovna uplata</label>
    </p>
    </fieldset>

      <p class="polje">
        <label for="razred">Razred</label>
        <input type="text" id="razred" name="razred" value="4.E" readonly>
      </p>

      <p class="izbor">
    <input type="checkbox" id="vege" name="vege">
    <label for="vege">Vegetarijanski obrok</label>
</p>

<p class="izbor">
    <input type="checkbox" id="prijevoz" name="prijevoz" value="autobus">
    <label for="prijevoz">Trebam prijevoz</label>
</p>

<p class="izbor">
    <input type="checkbox" id="pravila" name="pravila"
           value="procitao_pravila" required>
    <label for="pravila">Pročitao sam pravila izleta</label>
</p>

<p class="polje">
        <button type="submit">Po&scaron;alji prijavu</button>
</p>


<form class="obrazac" action="primljeno.html" method="get"></form>

    </form>

  </main>

</body>
</html>
