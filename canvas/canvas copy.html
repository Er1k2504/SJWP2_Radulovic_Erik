<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <canvas id="mycanvas" width="600px" height="600px" style="border: 1px solid black;"></canvas>
</body>

<script>
let c = document.getElementById("mycanvas");
let ctx = c.getContext("2d");

//cetverokut

ctx.beginPath();
ctx.rect(100, 150, 300, 200);
ctx.fillStyle = "blue";
ctx.fill();

ctx.beginPath();
ctx.moveTo(100, 150);
ctx.lineTo(250, 100);
ctx.lineTo(400, 150);
ctx.lineTo(100,150);
ctx.stroke();
ctx.fillStyle = "red"
ctx.fill();

ctx.beginPath();
ctx.rect(150, 250, 50, 100)
ctx.fillStyle = "lightblue"
ctx.fill();

ctx.beginPath();
ctx.rect(250, 250, 100, 50)
ctx.fillStyle = "lightblue"
ctx.fill();






</script>
</html>
