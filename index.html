<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJIWP ER</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0b1b33;
            color: white;
        }

        header {
            background-color: #071426;
            padding: 30px;
            text-align: center;
            border-bottom: 2px solid #183b68;
        }

        header h1 {
            color: #4da3ff;
            margin-bottom: 10px;
        }

        header p {
            color: #a9c7e8;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 35px;
        }

        .intro h2 {
            margin-bottom: 10px;
        }

        .intro p {
            color: #a9c7e8;
        }

        .tasks {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .task {
            background-color: #102a4c;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #1d4d7d;
            transition: 0.3s;
        }

        .task:hover {
            transform: translateY(-5px);
            background-color: #15365f;
        }

        .task h3 {
            color: #4da3ff;
            margin-bottom: 10px;
        }

        .task p {
            color: #b9cde3;
            margin-bottom: 20px;
        }

        .task a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #1769aa;
            padding: 10px 18px;
            border-radius: 7px;
            transition: 0.3s;
        }

        .task a:hover {
            background-color: #2185d0;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            background-color: #071426;
            color: #7895b5;
        }
    </style>
</head>

<body>

    <header>
        <h1>Skriptni Jezici i Web Programiranje</h1>
        <p>Moja stranica za zadaće</p>
        <br>
        <p>Erik Radulović™</p>
    </header>

    <main>

        <div class="intro">
            <h2>Moje zadaće</h2>
            <p>Ovdje možeš pronaći sve zadaće iz web programiranja.</p>
        </div>

        <section class="tasks">

            <div class="task">
                <h3>Zadaća 1</h3>
                <p></p>
                <a href="zadatak1.html">Otvori</a>
            </div>

            <div class="task">
                <h3>Zadaća 2</h3>
                <p></p>
                <a href="zadatak2.html">Otvori</a>
            </div>

            <div class="task">
                <h3>Zadaća 3</h3>
                <p></p>
                <a href="zadatak3.html">Otvori</a>
            </div>

            <div class="task">
                <h3>Zadatak 4</h3>
                <p></p>
                <a href="zadatak4.html">Otvori</a>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 - Erik Radulović</p>
    </footer>

</body>
</html>
